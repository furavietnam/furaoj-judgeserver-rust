[package]
name = "furaoj-judgeserver-rust"
version = "2.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
nix = { version = "0.29", features = ["process", "sched", "mount", "resource", "signal", "fs", "user"] }
libseccomp = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.10"
